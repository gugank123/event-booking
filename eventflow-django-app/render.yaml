services:
  - type: web
    name: eventflow-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn eventflow.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MYSQL_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true
      - key: DEFAULT_FROM_EMAIL
        value: EventFlow <noreply@eventflow.dev>
      - key: SUPPORT_EMAIL
        value: support@eventflow.dev
      - key: SUPPORT_PHONE
        value:
