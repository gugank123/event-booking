services:
  - type: web
    name: eventflow-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "/bin/sh -c 'gunicorn eventflow.wsgi:application --bind 0.0.0.0:$PORT --workers 2'"
    rootDir: eventflow-django-app/backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MYSQL_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_SSL_CA_CONTENT
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true
      - key: DEFAULT_FROM_EMAIL
        value: EventFlow <noreply@eventflow.dev>
      - key: SUPPORT_EMAIL
        value: support@eventflow.dev
      - key: SUPPORT_PHONE
        value:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: 2.0
      - key: TAX_PERCENT
        value: 0.0
      - key: SEAT_HOLD_MINUTES
        value: 8
      - key: CANCELLATION_WINDOW_HOURS
        value: 24
