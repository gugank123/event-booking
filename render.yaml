services:
  - type: web
    name: event-booking
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn event_booking.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.0
databases:
  - name: event-booking-db
    plan: free
